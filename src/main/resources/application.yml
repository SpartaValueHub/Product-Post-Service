# 판매글 서비스 정책 (환경별로 덮어쓸 수 있음)
product-post:
  policy:
    min-price: ${PRODUCT_POST_MIN_PRICE:500000}
    bump-daily-limit: ${PRODUCT_POST_BUMP_DAILY_LIMIT:2}
    bump-cooldown-hours: ${PRODUCT_POST_BUMP_COOLDOWN_HOURS:12}
  search:
    popular-limit: 5
    keyword-max-length: 50
    # MySQL ngram_token_size 기본값과 맞춤
    fulltext-min-keyword-length: 2
    terms-zset-key: search:terms:z
    terms-hourly-zset-key-prefix: "search:terms:h:"
    # 8일 (7일 윈도우 + 여유)
    terms-hourly-ttl-ms: 691200000
    popular-serving-key: search:popular
    snapshot-building-suffix: ":building"
    # 추천·연관 TopN 베이크 주기 (기본 60분)
    bake-interval-ms: 3600000
    bake-initial-delay-ms: 60000
    bake-min-score: 1
    # 24h/7d 각 윈도우에서 가중 후보 상한 (전체 멤버 스캔 방지)
    bake-candidate-limit: 500
    term-score-increment: 1
    # 가중: 24h×3 + (7d-24h)×1 (클릭 가중은 후속)
    weight-recent-24h: 3
    weight-recent-7d-remainder: 1
    recent-window-hours-24h: 24
    recent-window-hours-7d: 168
    score-zone-id: Asia/Seoul
    terms-aggregate-temp-key-prefix: "search:terms:agg:"
    bake-lock-key: search:popular:bake-lock
    bake-lock-ttl-ms: 300000
    bake-lock-value: "1"
    cooccurrence-zset-key-prefix: "search:cooc:z:"
    cooccurrence-sources-key: search:cooc:sources
    cooccurrence-score-increment: 1
    related-serving-key-prefix: "search:related:"
    related-bake-min-score: 2
    related-bake-lock-key: search:related:bake-lock
    session-last-key-prefix: "search:session:last:"
    session-member-prefix: "m:"
    session-anonymous-prefix: "s:"
    # 직전 검색어 TTL (기본 30분)
    session-last-ttl-ms: 1800000
    # 자동완성 (개수는 popular-limit 과 동일)
    suggestions-min-length: 2
    suggestions-dict-key: search:suggest:dict
    suggestions-dict-limit: 2000
    suggestions-bake-lock-key: search:suggest:bake-lock
    popular-seed:
      - 롤렉스
      - 샤넬백
      - 빈티지 백
      - 보증몬드 반지
      - 오메가
      - 에르메스
      - 보증통
      - 골드바
      - 명품시계
      - 보증목걸이
    related:
      샤넬백:
        - 샤넬백 보증서
        - 샤넬 클래식
        - 샤넬백 A급
      롤렉스:
        - 롤렉스 서브마리너
        - 롤렉스 데이토나
        - 롤렉스 보증서
      빈티지 백:
        - 빈티지 샤넬
        - 빈티지 에르메스

spring:
  application:
    name: product-post-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 이미지 Presigned 업로드 (EC2 Instance Role — Access Key 불필요)
app:
  media:
    s3-bucket: ${S3_BUCKET:}
    cloudfront-base-url: ${CLOUDFRONT_BASE_URL:}
    aws-region: ${AWS_REGION:ap-northeast-2}
    max-bytes: 5242880
    presign-ttl-seconds: 300
    pending-prefix: pending/
    confirmed-prefix: posts/
    extension-by-content-type:
      "[image/jpeg]": jpg
      "[image/png]": png
      "[image/webp]": webp
      "[image/gif]": gif

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # instance-id는 EurekaInstancePortCustomizer에서 실제 할당 포트로 설정 (예: product-post-service:51234)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
